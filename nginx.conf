server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # The issuer API token is added here from the ISSUER_API_TOKEN env var (substituted at container start),
    # so only the calls the portal makes are forwarded; everything else under /api/credentials/ is refused.
    location ~ ^/api/credentials/(issue/client/bulk|issued/[^/]+|presentation)$ {
        proxy_pass https://api.credissuer.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.credissuer.com;
        proxy_set_header Authorization "Bearer ${ISSUER_API_TOKEN}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/credentials/ {
        return 404;
    }

    location /api/ {
        # proxy_pass http://digitalid-backend.digitalid.svc.cluster.local:8000/;
        proxy_pass https://id.assembly.govstack.global/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
