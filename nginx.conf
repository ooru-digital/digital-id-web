server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/credentials/ {
        proxy_pass https://api.credissuer.com/api/credentials/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.credissuer.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # proxy_pass http://digitalid-backend.digitalid.svc.cluster.local:8000/;
        proxy_pass https://id.assembly.govstack.global/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}